name: Elev8
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.4
targets:
  Elev8:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dfeleppa.elev8
    info:
      path: .build/Info.plist
      properties:
        CFBundleDisplayName: Elev8
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ELEV8_API_URL: $(ELEV8_API_URL)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_PUBLIC_KEY: $(SUPABASE_PUBLIC_KEY)
    dependencies:
      - package: Supabase
  Elev8Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: ../../../packages/contracts/fixtures
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dfeleppa.elev8.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Elev8
schemes:
  Elev8:
    build:
      targets:
        Elev8: all
    test:
      targets: [Elev8Tests]
